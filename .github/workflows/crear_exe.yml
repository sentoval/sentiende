name: Crear SeFinancia.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Tesseract (OCR)
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          & "C:\Program Files\Tesseract-OCR\tesseract.exe" --version

      - name: Crear el programa
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: python construir/construir.py --destino "$env:GITHUB_WORKSPACE\salida\SeFinancia" --estricto

      - name: Pruebas del motor en Windows
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pip install reportlab
          $env:PATH = "$env:GITHUB_WORKSPACE\salida\SeFinancia\Motor\tesseract;$env:PATH"
          $env:TESSDATA_PREFIX = "$env:GITHUB_WORKSPACE\salida\SeFinancia\Motor\tesseract\tessdata"
          cd codigo
          python -m unittest discover -s pruebas -t . -v

      - name: Comprimir
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force salida\SeFinancia\Datos -ErrorAction SilentlyContinue
          Compress-Archive -Path salida\SeFinancia -DestinationPath SeFinancia_v3.1.1_windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SeFinancia_v3.1.1_windows
          path: SeFinancia_v3.1.1_windows.zip

      - name: Publicar para descargar
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.1
          name: SeFinancia v3.1.1
          prerelease: false
          make_latest: true
          files: SeFinancia_v3.1.1_windows.zip
          body: |
            SeFinancia 3.1.1 · motor Sentiende 3.1.1 (compilación ${{ github.run_number }}).
            Descarga SeFinancia_v3.1.1_windows.zip, descomprímelo y copia la carpeta encima de la anterior (la carpeta Datos no se toca).

            Novedades de la 3.1.1:
            - Correo con reglas de «apto»: espera 1 minuto en la revisión automática (a mano no espera); remitente conocido (en los correos de una ficha) con adjuntos entra y sin adjuntos te avisa; desconocido sin adjuntos o con fotos que no se reconocen queda con la etiqueta «No_Apto_SeFina»; con Word/Excel y sin PDF te pregunta en la campanita sin abrirlos (Sí / No / No y bloquear); con algún PDF entra (si solo trae PDF y nada se relaciona con lo registrado, vuelve a la bandeja de entrada).
            - Los correos aptos se mueven a la carpeta «procesadosMMAA» del buzón (solo si el servidor permite moverlos sin borrar nada) y avisan en la campanita: «Correo recibido y procesado Apto de…», con el asunto y el texto del correo.
            - Ficha de persona con «Correo informado» (a mano) y «Correos recibidos» (se apuntan solos). «Nueva persona» y «Expediente manual» piden el correo.
            - Botón «Ver saldo de la API» en Ajustes › Controlador IA.
            - Las bailaoras del Centro de revisión cambian un 40 % más rápido.

            Novedades de la 3.1.0:
            - Expediente: botón grande «Documentación» arriba a la derecha (pantalla aparte con archivo, tipo, de quién, Abrir, Mover y Papelera) y tarjeta «Datos leídos» con DNI, teléfono, correo y dirección de cada titular y los contactos del banco.
            - Personas: «＋ Nueva persona» y «Expediente manual»; lo que metes a mano es la referencia segura y, si llega algo muy parecido, te avisa en la campanita para confirmarlo o cambiarlo.
            - Menú: Expedientes · Personas · Centro de revisión · Motor de proceso (con icono de engranaje). Engranajes que giran cuando trabajan el motor y la IA.
            - Cambiar el tipo de financiación de un expediente desde su cabecera.
            - Tipos nuevos: Contrato bancario, Declaración de residencia fiscal, Declaración de bienes; «Modificación del contrato de trabajo» con su nombre. Número de modelo en las etiquetas: (131) Pago fraccionado, (303) IVA…
            - Hacienda: ejercicio y trimestre leídos en la cabecera; nombres con el trimestre (…_2T26), sin segundas versiones.
            - Recibos y extractos en serie (misma cuenta o préstamo, meses distintos): se revisan juntos y se guardan cada uno con su mes.
            - Más reconocimiento: recibos con «CLIENTE:», CIRBE, rentas de cada cónyuge, páginas del mismo PDF, liquidaciones TPV, certificados de titularidad.
            - Centro de revisión vacío con bailaoras flamencas; el programa se abre a pantalla completa; sin ventanas negras al procesar.
            - Arreglos: «Reanudar lo pendiente» reintenta lo parado; el lote ya no se queda en 91 %; «N para mirar» de la IA con su propia pantalla; mover un PDF abierto en otro programa avisa en vez de dar WinError 32; el escáner AirScan reintenta mientras calienta la lámpara; Excel sin vista previa ya no da error.

            Novedades de la 3.0.2:
            - Seguridad: el enmascarado de datos personales se ha reforzado (nombres con etiqueta, «APELLIDOS, NOMBRE», NIF con 0 delante, direcciones abreviadas, NAF) y hay un vigilante final: si queda cualquier dato personal en el texto, no se envía nada a la IA y el documento queda «Para ti».
            - Contexto del lote (sin internet): el programa mira todo el lote junto, decide el titular y los cotitulares, crea el expediente si no existe y te avisa en la campanita («Revisar expediente» / «Visto»).
            - Un DNI solo vale si aparece en al menos 2 documentos (o ya está en una ficha); los documentos sin nombre se relacionan por cuenta, teléfono, correo, matrícula o referencia catastral.
            - La IA (si está activada) revisa el lote entero en una consulta y supervisa lo que ha hecho el contexto; en el informe se ve qué hizo el programa (Local) y qué la IA.
            - Las fotos solo se unen entre sí (nunca PDFs ni documentos individuales como nóminas) y por debajo del umbral no se une nada.
            - Aprendizaje: liquidaciones de TPV (nuevo tipo), modelos 131/303, CAP en valenciano, certificado de saldo, solicitud de aval, PIAS, CIRBE, DNI, recibos de préstamo y listas de nombres y apellidos ampliadas.

            Arreglos sobre la 3.0 (primera prueba real):
            - La IA piensa antes de contestar: ahora tiene margen suficiente para la respuesta (y repite una vez si se queda corta) y trabaja siempre con esfuerzo «bajo».
            - Si una consulta no trae respuesta útil, ese documento (o ese grupo de fotos) queda «Para ti» con el motivo y el lote sigue; antes se paraba entero.
            - El gasto previsto se calcula con una respuesta habitual, no con el máximo.
            - «Informe de la IA» visible en cada lote que haya pasado por la IA, aunque no haya hecho nada.

            Novedades sobre la 1.3 · Controlador IA (viene apagado):
            - Botón «Controlador IA» en la barra lateral: encendido brilla y muestra el gasto; en pausa, fondo mostaza; apagado, gris.
            - Resuelve solo, con la API de Anthropic, lo que el programa no sabe: tipo, fecha, separar y ordenar páginas, unir fotos, misma persona, terceros y asignar a un expediente existente. Nunca crea expedientes ni añade personas.
            - Solo texto y sin datos personales: nombres, DNI, IBAN, teléfonos, direcciones… van como fichas ([PERSONA_1]); la tabla se queda en el equipo. «Ver lo que se envía».
            - Informe por lote con el motivo de cada acción, «Deshacer» y «Deshacer todo»; por debajo del 90 % queda marcado para mirar; «Misma persona» siempre como aviso.
            - Límites de gasto (0,50 € al día, 10 € al mes, 0,10 € por lote), tarifas editables y comprobadas como máximo una vez al día, comparativa de modelos.
            - Instrucciones para la IA, aprendizaje de tus correcciones (exportable sin datos personales). Clave cifrada con Windows.
            - Cuadro «Arrastra aquí» con iconos: archivos, correo, Bluetooth y escáner.
