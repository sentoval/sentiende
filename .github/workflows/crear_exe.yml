name: Crear SeFinancia.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Tesseract (OCR)
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          & "C:\Program Files\Tesseract-OCR\tesseract.exe" --version

      - name: Crear el programa
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: python construir/construir.py --destino "$env:GITHUB_WORKSPACE\salida\SeFinancia" --estricto

      - name: Pruebas del motor en Windows
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pip install reportlab
          $env:PATH = "$env:GITHUB_WORKSPACE\salida\SeFinancia\Motor\tesseract;$env:PATH"
          $env:TESSDATA_PREFIX = "$env:GITHUB_WORKSPACE\salida\SeFinancia\Motor\tesseract\tessdata"
          cd codigo
          python -m unittest discover -s pruebas -t . -v

      - name: Comprimir
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force salida\SeFinancia\Datos -ErrorAction SilentlyContinue
          Compress-Archive -Path salida\SeFinancia -DestinationPath SeFinancia_v1.3_windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SeFinancia_v1.3_windows
          path: SeFinancia_v1.3_windows.zip

      - name: Publicar para descargar
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3
          name: SeFinancia v1.3
          prerelease: false
          make_latest: true
          files: SeFinancia_v1.3_windows.zip
          body: |
            SeFinancia 1.3 · motor Sentiende 2.3.0 (compilación ${{ github.run_number }}).
            Descarga SeFinancia_v1.3_windows.zip, descomprímelo y copia la carpeta encima de la anterior (la carpeta Datos no se toca).

            Novedades sobre la 1.2:
            - La misma persona aunque falte un apellido; «Es la misma que…» en la revisión y en el expediente (con alias).
            - Checklist más ligera (grupos con barrita de color) y «Generar informe de lo que falta y enviar» por correo o WhatsApp con texto amable.
            - Avisos: «Avisos cliente» dentro de Expedientes; campanita de avisos del programa arriba solo si hay algo nuevo.
            - Menú: Ajustes a la izquierda, lupa a la derecha.
            - Escanear: escáneres USB, de red instalados en Windows y AirScan/eSCL por red o Wi-Fi (búsqueda automática o por IP), color, resolución y alimentador.
