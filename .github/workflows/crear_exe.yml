name: Crear SeFinancia.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Tesseract (OCR)
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          & "C:\Program Files\Tesseract-OCR\tesseract.exe" --version

      - name: Crear el programa
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: python construir/construir.py --destino "$env:GITHUB_WORKSPACE\salida\SeFinancia" --estricto

      - name: Pruebas del motor en Windows
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pip install reportlab
          $env:PATH = "$env:GITHUB_WORKSPACE\salida\SeFinancia\Motor\tesseract;$env:PATH"
          $env:TESSDATA_PREFIX = "$env:GITHUB_WORKSPACE\salida\SeFinancia\Motor\tesseract\tessdata"
          cd codigo
          python -m unittest discover -s pruebas -t . -v

      - name: Comprimir
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force salida\SeFinancia\Datos -ErrorAction SilentlyContinue
          Compress-Archive -Path salida\SeFinancia -DestinationPath SeFinancia_v1.2_windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SeFinancia_v1.2_windows
          path: SeFinancia_v1.2_windows.zip

      - name: Publicar para descargar
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2
          name: SeFinancia v1.2
          prerelease: false
          make_latest: true
          files: SeFinancia_v1.2_windows.zip
          body: |
            SeFinancia 1.2 · motor Sentiende 2.2.0 (compilación ${{ github.run_number }}).
            Descarga SeFinancia_v1.2_windows.zip, descomprímelo y copia la carpeta encima de la anterior (la carpeta Datos no se toca).

            Novedades:
            - Expediente como en el diseño: Negociación banco (varios bancos, con estado, contactos y notas) y Negociación cliente; checklist por titular y familia con Solicitado / Sin pedir e informe de lo que falta.
            - Estado y datos de la operación: fases, firmado, cerrado sin operación, importes, honorarios y cobro; favorito y prioridad; pestañas En curso / Firmados / Cerrados.
            - Tarjetas de visita (siempre pregunta), escrituras sin persona preseleccionada, terceros recordados por lote, confirmar cotitular, quitar persona.
            - Personas y ficha de persona, Papelera (eliminar y restaurar), Buscar en documentos, Estadísticas, Reglas de nombres y tipos.
            - Separar un PDF a mano, girar páginas, segunda aportación (-ant), discrepancias de DNI, mover a otro expediente desde la revisión.
            - Ajustes: carpetas, OCR, tamaño del texto, copia de seguridad; correo por revisar (remitentes nuevos); escanear (WIA); exportar expediente en zip; primer arranque.
